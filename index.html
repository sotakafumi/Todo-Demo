<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TODO</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="src/style.css">
    <script type="module" src="src/app.js"></script>
  </head>
  <body>
    <main class="app">
      <h1>TODO</h1>

      <form id="new-todo-form" class="new-todo">
        <input id="new-todo" type="text" placeholder="やることを入力して Enter" autocomplete="off" autofocus aria-label="新しいTODO">
        <button type="submit">追加</button>
      </form>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty" class="empty" hidden></p>

      <footer id="footer" class="footer" hidden>
        <span id="count"></span>
        <div class="filters" role="group" aria-label="表示フィルター">
          <button type="button" data-filter="all">すべて</button>
          <button type="button" data-filter="active">未完了</button>
          <button type="button" data-filter="completed">完了</button>
        </div>
        <button type="button" id="clear-completed" class="clear" hidden>完了済みを削除</button>
      </footer>
    </main>
  </body>
</html>
